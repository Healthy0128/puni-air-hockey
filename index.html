<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#171a2c" />
<title>ぷにぷにエアホッケー</title>
<style>
:root{--bg:#16192c;--panel:rgba(255,255,255,.12);--text:#fff;--muted:#cfd4ff;--p1:#4cc9ff;--p2:#ff6fae;--accent:#ffe46b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0,#2b315b 0,#171a2c 45%,#0c0f1c 100%);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:none}
button{font:inherit;color:inherit;border:0}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}
#rotate{z-index:50;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:32px;background:#171a2c}.phone{font-size:64px;animation:turn 1.5s ease-in-out infinite alternate}@keyframes turn{to{transform:rotate(90deg)}}
#title{align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;text-align:center;background:radial-gradient(circle at 50% 35%,rgba(255,228,107,.16),transparent 35%)}
.logo{font-weight:1000;font-size:clamp(30px,7vw,72px);line-height:.9;letter-spacing:.03em;text-shadow:0 4px 0 rgba(0,0,0,.2)}
.logo small{display:block;font-size:.34em;letter-spacing:.16em;color:var(--accent);margin-top:10px}
.duel{display:flex;align-items:center;gap:24px;margin:8px 0}.blob{width:min(17vw,116px);aspect-ratio:1;border-radius:46% 54% 52% 48%;position:relative;box-shadow:inset 0 10px 18px rgba(255,255,255,.24),0 14px 28px rgba(0,0,0,.28);animation:squish 1.4s ease-in-out infinite alternate}.blob.blue{background:linear-gradient(145deg,#8ce9ff,#39a9ff)}.blob.pink{background:linear-gradient(145deg,#ff9bca,#ff5d9d);animation-delay:.2s}.blob:before,.blob:after{content:"";position:absolute;top:37%;width:9%;height:13%;background:#17213a;border-radius:50%}.blob:before{left:31%}.blob:after{right:31%}.mouth{position:absolute;left:50%;top:55%;transform:translateX(-50%);width:22%;height:12%;border:4px solid #17213a;border-top:0;border-radius:0 0 18px 18px}.puck-demo{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 10%,#ffe16b 11% 32%,#ffb64c 65%,#f68a38);box-shadow:0 0 22px rgba(255,225,107,.7)}
@keyframes squish{from{transform:translateY(3px) scale(1.02,.98)}to{transform:translateY(-4px) scale(.96,1.05)}}
.menu{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.btn{background:linear-gradient(#fff,#e9ecff);color:#202444;font-weight:900;padding:12px 24px;border-radius:999px;box-shadow:0 7px 0 #aeb6e6,0 11px 22px rgba(0,0,0,.25);min-width:140px}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #aeb6e6}.sub{font-size:12px;color:var(--muted)}
#game{background:#0c1021}.hud{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;pointer-events:none}.score{min-width:145px;padding:8px 14px;border-radius:999px;background:rgba(12,16,33,.72);backdrop-filter:blur(9px);font-weight:1000;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}.pause{position:absolute;z-index:8;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;background:rgba(12,16,33,.72);font-weight:1000;box-shadow:0 5px 16px rgba(0,0,0,.25)}
canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;background:rgba(8,10,22,.75);display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(8px)}.overlay.show{display:flex}.card{width:min(520px,90vw);background:#24294b;border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:24px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.4)}.card h2{margin:0 0 14px;font-size:32px}.card .btn{margin:7px}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:12px 0}.toggle{width:70px;min-width:70px;padding:9px 12px;border-radius:999px;background:#3c426d}.toggle.on{background:#49c58c}.howto{font-size:15px;line-height:1.8;text-align:left;color:#eef0ff}
#toast{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;font-size:clamp(28px,6vw,72px);font-weight:1000;text-shadow:0 5px 0 rgba(0,0,0,.2);pointer-events:none}.pop{animation:toast .9s ease both}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(1)}}
@media (orientation:portrait){#rotate{display:flex!important}#title,#game{display:none!important}}
@media (orientation:landscape){#rotate{display:none!important}}
</style>
</head>
<body>
<div id="app">
<section id="rotate" class="screen"><div class="phone">📱</div><h2>スマホを横向きにしてね！</h2><div class="sub">1台を2人で挟んで遊びます</div></section>
<section id="title" class="screen active">
  <div class="logo">ぷにぷに<br>エアホッケー<small>PUNI PUNI AIR HOCKEY</small></div>
  <div class="duel"><div class="blob blue"><div class="mouth"></div></div><div class="puck-demo"></div><div class="blob pink"><div class="mouth"></div></div></div>
  <div class="menu"><button class="btn" id="startBtn">START</button><button class="btn" id="howBtn">あそびかた</button><button class="btn" id="settingsBtn">設定</button></div>
  <div class="sub">2人対戦・1台共有・5点先取</div>
</section>
<section id="game" class="screen">
  <canvas id="c"></canvas><div class="hud"><div class="score"><span style="color:var(--p1)">BLUE</span> <span id="s1">0</span> - <span id="s2">0</span> <span style="color:var(--p2)">PINK</span></div></div><button id="pauseBtn" class="pause">Ⅱ</button><div id="toast"></div>
</section>
<div id="howOverlay" class="overlay"><div class="card"><h2>あそびかた</h2><div class="howto">👈 左の人は青ぷにを指で動かす<br>👉 右の人はピンクぷにを指で動かす<br>🥅 相手のゴールに入れたら1点<br>⚡ 素早く振り抜くほど強いショット！<br>🏆 5点先取で勝ち！</div><button class="btn close">OK</button></div></div>
<div id="settingsOverlay" class="overlay"><div class="card"><h2>設定</h2><div class="settings-row"><span>BGM</span><button id="bgmToggle" class="toggle on">ON</button></div><div class="settings-row"><span>効果音</span><button id="sfxToggle" class="toggle on">ON</button></div><button class="btn close">OK</button></div></div>
<div id="pauseOverlay" class="overlay"><div class="card"><h2>PAUSE</h2><button id="resumeBtn" class="btn">つづける</button><button id="restartBtn" class="btn">最初から</button><button id="titleBtn" class="btn">タイトルへ</button></div></div>
<div id="resultOverlay" class="overlay"><div class="card"><h2 id="resultTitle">BLUE WIN!</h2><p id="resultScore"></p><button id="againBtn" class="btn">もう一回！</button><button id="resultTitleBtn" class="btn">タイトルへ</button></div></div>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), canvas=$('#c'), ctx=canvas.getContext('2d');
const title=$('#title'), game=$('#game'), toast=$('#toast');
const state={running:false,paused:false,last:0,w:0,h:0,dpr:1,score:[0,0],goalToWin:5,shake:0,flash:0,particles:[],trails:[],roundDelay:0};
const settings=JSON.parse(localStorage.getItem('puniSettings')||'{"bgm":true,"sfx":true}');
function saveSettings(){localStorage.setItem('puniSettings',JSON.stringify(settings));syncToggles()}
function syncToggles(){for(const [id,key] of [['#bgmToggle','bgm'],['#sfxToggle','sfx']]){const el=$(id);el.classList.toggle('on',settings[key]);el.textContent=settings[key]?'ON':'OFF'}}
class AudioManager{
 constructor(){this.ctx=null;this.master=null;this.bgmTimer=null;this.step=0}
 unlock(){if(!this.ctx){this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=.35;this.master.connect(this.ctx.destination)} if(this.ctx.state==='suspended')this.ctx.resume();if(settings.bgm)this.startBgm()}
 tone(f=440,d=.06,type='sine',vol=.08,when=0){if(!settings.sfx||!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime+when;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d)}
 hit(speed=1){this.tone(150+Math.random()*80,.045,'sine',Math.min(.12,.045+speed*.025));this.tone(360+Math.random()*100,.03,'triangle',.035)}
 wall(){this.tone(130,.035,'triangle',.035)}
 goal(){[523,659,784,1046].forEach((f,i)=>this.tone(f,.16,'triangle',.11,i*.055))}
 click(){this.tone(520,.035,'sine',.05)}
 startBgm(){if(this.bgmTimer||!this.ctx||!settings.bgm)return;const seq=[262,330,392,523,392,330,294,349,440,587,440,349];this.bgmTimer=setInterval(()=>{if(!settings.bgm||!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime;o.type='square';o.frequency.value=seq[this.step++%seq.length];g.gain.setValueAtTime(.018,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.13)},180)}
 stopBgm(){clearInterval(this.bgmTimer);this.bgmTimer=null}
}
const audio=new AudioManager();
const players=[{side:0,x:0,y:0,r:46,color:'#4cc9ff',dark:'#168ed6',pid:null,vx:0,vy:0,tx:0,ty:0,squish:0,face:0},{side:1,x:0,y:0,r:46,color:'#ff6fae',dark:'#d73778',pid:null,vx:0,vy:0,tx:0,ty:0,squish:0,face:0}];
const puck={x:0,y:0,r:22,vx:0,vy:0,max:1500};
function resize(){state.dpr=Math.min(2,devicePixelRatio||1);state.w=innerWidth;state.h=innerHeight;canvas.width=state.w*state.dpr;canvas.height=state.h*state.dpr;canvas.style.width=state.w+'px';canvas.style.height=state.h+'px';ctx.setTransform(state.dpr,0,0,state.dpr,0,0);const r=Math.min(54,Math.max(36,state.h*.095));players.forEach(p=>p.r=r);puck.r=Math.max(16,state.h*.038);if(!state.running)resetPositions()}
function resetPositions(){players[0].x=state.w*.22;players[0].y=state.h*.5;players[1].x=state.w*.78;players[1].y=state.h*.5;players.forEach(p=>{p.tx=p.x;p.ty=p.y;p.vx=p.vy=0;p.pid=null});puck.x=state.w/2;puck.y=state.h/2;puck.vx=(Math.random()>.5?1:-1)*220;puck.vy=(Math.random()-.5)*180}
function startMatch(){audio.unlock();state.score=[0,0];$('#s1').textContent=0;$('#s2').textContent=0;title.classList.remove('active');game.classList.add('active');state.running=true;state.paused=false;resize();resetPositions();say('READY!');state.last=performance.now();requestAnimationFrame(loop)}
function endToTitle(){state.running=false;state.paused=false;game.classList.remove('active');title.classList.add('active');document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'))}
function restart(){state.score=[0,0];$('#s1').textContent=0;$('#s2').textContent=0;state.paused=false;$('#pauseOverlay').classList.remove('show');$('#resultOverlay').classList.remove('show');resetPositions();say('READY!')}
function say(t){toast.textContent=t;toast.classList.remove('pop');void toast.offsetWidth;toast.classList.add('pop')}
function spawn(x,y,color,n=12){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=80+Math.random()*350;state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.45,size:3+Math.random()*7,color})}if(state.particles.length>180)state.particles.splice(0,state.particles.length-180)}
function clampPlayer(p){const pad=p.r+10;const mid=state.w/2,gap=12;p.x=Math.max(p.side===0?pad:mid+gap+p.r,Math.min(p.side===0?mid-gap-p.r:state.w-pad,p.x));p.y=Math.max(pad,Math.min(state.h-pad,p.y))}
function handleInput(e,down){if(!state.running||state.paused)return;const x=e.clientX,y=e.clientY;let p=players.find(q=>q.pid===e.pointerId);if(down&&!p){const side=x<state.w/2?0:1;p=players[side];if(p.pid!==null)return;p.pid=e.pointerId;canvas.setPointerCapture?.(e.pointerId)}if(!p)return;p.tx=x;p.ty=y;if(!down){p.pid=null;canvas.releasePointerCapture?.(e.pointerId)}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();handleInput(e,true)},{passive:false});canvas.addEventListener('pointermove',e=>{e.preventDefault();handleInput(e,true)},{passive:false});['pointerup','pointercancel','lostpointercapture'].forEach(n=>canvas.addEventListener(n,e=>handleInput(e,false)));
function update(dt){if(state.roundDelay>0){state.roundDelay-=dt;return}const smooth=Math.min(1,dt*22);for(const p of players){const ox=p.x,oy=p.y;p.x+=(p.tx-p.x)*smooth;p.y+=(p.ty-p.y)*smooth;clampPlayer(p);p.vx=(p.x-ox)/Math.max(dt,.001);p.vy=(p.y-oy)/Math.max(dt,.001);p.squish*=Math.pow(.001,dt);p.face=Math.max(0,p.face-dt)}
 const sub=Math.max(1,Math.ceil(Math.hypot(puck.vx,puck.vy)*dt/Math.max(8,puck.r*.65))),sdt=dt/sub;for(let k=0;k<sub;k++)stepPhysics(sdt);
 puck.vx*=Math.pow(.995,dt*60);puck.vy*=Math.pow(.995,dt*60);const sp=Math.hypot(puck.vx,puck.vy);if(sp>puck.max){puck.vx*=puck.max/sp;puck.vy*=puck.max/sp}
 state.trails.push({x:puck.x,y:puck.y,life:.16});if(state.trails.length>16)state.trails.shift();for(const t of state.trails)t.life-=dt;state.trails=state.trails.filter(t=>t.life>0);for(const q of state.particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=180*dt;q.life-=dt}state.particles=state.particles.filter(q=>q.life>0);state.shake=Math.max(0,state.shake-dt*18);state.flash=Math.max(0,state.flash-dt*3)}
function stepPhysics(dt){puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;const goalH=Math.min(state.h*.35,190),gy=(state.h-goalH)/2; if(puck.y-puck.r<0){puck.y=puck.r;puck.vy=Math.abs(puck.vy);audio.wall()} if(puck.y+puck.r>state.h){puck.y=state.h-puck.r;puck.vy=-Math.abs(puck.vy);audio.wall()}
 const inGoal=puck.y>gy&&puck.y<gy+goalH;if(puck.x-puck.r<0){if(inGoal)return scoreGoal(1);puck.x=puck.r;puck.vx=Math.abs(puck.vx);audio.wall()}if(puck.x+puck.r>state.w){if(inGoal)return scoreGoal(0);puck.x=state.w-puck.r;puck.vx=-Math.abs(puck.vx);audio.wall()}
 for(const p of players){const dx=puck.x-p.x,dy=puck.y-p.y,d=Math.hypot(dx,dy),min=p.r+puck.r;if(d<min&&d>0){const nx=dx/d,ny=dy/d,over=min-d;puck.x+=nx*over;puck.y+=ny*over;const relx=puck.vx-p.vx*.58,rely=puck.vy-p.vy*.58,dot=relx*nx+rely*ny;if(dot<0){puck.vx-=1.8*dot*nx;puck.vy-=1.8*dot*ny}puck.vx+=p.vx*.48;puck.vy+=p.vy*.48;p.squish=.18;p.face=.16;const impact=Math.min(4,Math.hypot(p.vx,p.vy)/600+Math.abs(dot)/900);audio.hit(impact);spawn(puck.x,puck.y,p.color,5+Math.floor(impact*2))}}
}
function scoreGoal(winner){if(state.roundDelay>0)return;state.score[winner]++;$('#s1').textContent=state.score[0];$('#s2').textContent=state.score[1];state.shake=1;state.flash=1;audio.goal();spawn(winner===0?state.w-20:20,puck.y,winner===0?'#4cc9ff':'#ff6fae',38);say('GOAL!');if(navigator.vibrate)navigator.vibrate(35);if(state.score[winner]>=state.goalToWin){state.paused=true;setTimeout(()=>{const name=winner===0?'BLUE':'PINK';$('#resultTitle').textContent=name+' WIN!';$('#resultScore').textContent=state.score[0]+' - '+state.score[1];$('#resultOverlay').classList.add('show')},650)}else{state.roundDelay=.75;setTimeout(()=>{if(state.running&&!state.paused){resetPositions();state.roundDelay=0}},760)}}
function draw(){ctx.save();if(state.shake){const m=state.shake*5;ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m)}drawField();for(const t of state.trails){ctx.globalAlpha=Math.max(0,t.life/.16)*.28;ctx.fillStyle='#ffe46b';ctx.beginPath();ctx.arc(t.x,t.y,puck.r*.72,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;drawPuck();players.forEach(drawPlayer);for(const q of state.particles){ctx.globalAlpha=Math.max(0,q.life/.7);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(state.flash){ctx.fillStyle=`rgba(255,255,255,${state.flash*.13})`;ctx.fillRect(0,0,state.w,state.h)}ctx.restore()}
function drawField(){const w=state.w,h=state.h,gH=Math.min(h*.35,190),gy=(h-gH)/2;const grd=ctx.createLinearGradient(0,0,w,h);grd.addColorStop(0,'#17324e');grd.addColorStop(.5,'#20213f');grd.addColorStop(1,'#4c203d');ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);ctx.globalAlpha=.12;for(let x=20;x<w;x+=52)for(let y=22;y<h;y+=52){ctx.fillStyle=((x+y)/52)%2?'#fff':'#ffe46b';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,.34)';ctx.lineWidth=4;ctx.setLineDash([12,14]);ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(w/2,h/2,Math.min(72,h*.16),0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#69d7ff';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(0,gy+gH);ctx.stroke();ctx.strokeStyle='#ff77b5';ctx.beginPath();ctx.moveTo(w,gy);ctx.lineTo(w,gy+gH);ctx.stroke();ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(0,gy,14,gH);ctx.fillRect(w-14,gy,14,gH)}
function drawPuck(){const g=ctx.createRadialGradient(puck.x-puck.r*.35,puck.y-puck.r*.4,2,puck.x,puck.y,puck.r);g.addColorStop(0,'#fff');g.addColorStop(.18,'#fff4a8');g.addColorStop(.52,'#ffd44d');g.addColorStop(1,'#f38b3e');ctx.shadowColor='rgba(255,212,77,.65)';ctx.shadowBlur=18;ctx.fillStyle=g;ctx.beginPath();ctx.arc(puck.x,puck.y,puck.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
function drawPlayer(p){const speed=Math.min(1.25,Math.hypot(p.vx,p.vy)/900),angle=Math.atan2(p.vy,p.vx);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(angle);const sx=1+speed*.16-p.squish*.7,sy=1-speed*.08+p.squish*.85;ctx.scale(sx,sy);const g=ctx.createRadialGradient(-p.r*.28,-p.r*.35,p.r*.08,0,0,p.r);g.addColorStop(0,'#fff');g.addColorStop(.12,p.color);g.addColorStop(1,p.dark);ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=16;ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.93,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.rotate(-angle);ctx.fillStyle='#17213a';const eyeY=-p.r*.1;ctx.beginPath();ctx.arc(-p.r*.22,eyeY,p.r*.065,0,Math.PI*2);ctx.arc(p.r*.22,eyeY,p.r*.065,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#17213a';ctx.lineWidth=Math.max(3,p.r*.07);ctx.lineCap='round';ctx.beginPath();if(p.face>0){ctx.moveTo(-p.r*.18,p.r*.18);ctx.lineTo(0,p.r*.3);ctx.lineTo(p.r*.18,p.r*.18)}else{ctx.arc(0,p.r*.15,p.r*.22,.15*Math.PI,.85*Math.PI)}ctx.stroke();ctx.restore()}
function loop(now){if(!state.running)return;const dt=Math.min(.033,(now-state.last)/1000||.016);state.last=now;if(!state.paused)update(dt);draw();requestAnimationFrame(loop)}
function openOverlay(sel){audio.unlock();audio.click();$(sel).classList.add('show')}
$('#startBtn').onclick=startMatch;$('#howBtn').onclick=()=>openOverlay('#howOverlay');$('#settingsBtn').onclick=()=>openOverlay('#settingsOverlay');document.querySelectorAll('.close').forEach(b=>b.onclick=()=>{audio.click();b.closest('.overlay').classList.remove('show')});
$('#pauseBtn').onclick=()=>{state.paused=true;openOverlay('#pauseOverlay')};$('#resumeBtn').onclick=()=>{audio.click();state.paused=false;$('#pauseOverlay').classList.remove('show');state.last=performance.now()};$('#restartBtn').onclick=()=>{audio.click();restart()};$('#titleBtn').onclick=()=>{audio.click();endToTitle()};$('#againBtn').onclick=()=>{audio.click();restart()};$('#resultTitleBtn').onclick=()=>{audio.click();endToTitle()};
$('#bgmToggle').onclick=()=>{settings.bgm=!settings.bgm;if(settings.bgm){audio.unlock();audio.startBgm()}else audio.stopBgm();saveSettings()};$('#sfxToggle').onclick=()=>{settings.sfx=!settings.sfx;saveSettings();if(settings.sfx){audio.unlock();audio.click()}};
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,120));document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.running&&!state.paused){state.paused=true;$('#pauseOverlay').classList.add('show')}});syncToggles();resize();
})();
</script>
</body>
</html>
